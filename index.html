<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06182b">
<title>Clarecastle Weather Clock</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06182b;color:#f7fbff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{padding:8px}
.dashboard{height:calc(100vh - 40px);width:100%;max-width:1400px;margin:auto;display:grid;grid-template-rows:5% minmax(0,1fr) 20%;gap:0.8%}
.brand{display:flex;align-items:center;justify-content:center;gap:2%;color:#d9eaff;font-weight:700;letter-spacing:3px;font-size:20px}
.brand:before,.brand:after{content:"";height:2px;width:15%;background:#4ea9df}
.top{min-height:0;display:grid;grid-template-columns:1.48fr 1fr;gap:1%}
.panel,.day{background:#071b30;border:2px solid #3679a6;border-radius:18px}
.clock-panel{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px;min-width:0}
.clock{font-size:26vw;font-weight:650;line-height:1;letter-spacing:-5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.date{font-size:2.8vw;color:#c6def2;margin-top:2vh;text-align:center}
.sun-times{display:flex;justify-content:center;gap:42px;margin-top:2.2vh;color:#c6def2;font-size:2.1vh;font-weight:600}
.sun-times span{color:#f7fbff}
.weather-details{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:12px;color:#c6def2;font-size:1.9vh;text-align:center}
.weather-details strong{color:#f7fbff;font-weight:650}
.weather-panel{padding:12px;display:flex;flex-direction:column;justify-content:space-evenly;min-width:0}
.current{display:flex;align-items:center;justify-content:center;gap:12px}
.current-icon{font-size:7vh}
.current-temp{font-size:7vh;font-weight:650;line-height:1}
.current-desc{color:#c6def2;font-size:2.1vh;margin-top:4px}
.rule{height:1px;background:#4b7897;margin:8px 0}
.section{font-size:2vh;font-weight:700;letter-spacing:1px;text-align:center;color:#d9eaff;margin:4px 0 8px}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.hour{text-align:center;min-width:0}
.hour-time{font-size:1.8vh;color:#c6def2}
.hour-icon{font-size:4vh;margin:5px 0}
.hour-temp{font-size:2.8vh;font-weight:650}
.rain{font-size:1.55vh;color:#83cafa;margin-top:3px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:1%;min-height:0}
.day{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:5px 2px;min-width:0}
.day-name{font-size:2.2vh;font-weight:700;color:#d9eaff}
.day-icon{font-size:4.5vh;margin:4px 0}
.day-temps{font-size:2.1vh;font-weight:650;white-space:nowrap}
.day-temps span{color:#83cafa}
.status{position:absolute;left:-9999px}
@media (orientation:landscape) and (min-width:700px) and (max-width:1100px){
 .clock{font-size:20vw;letter-spacing:-3px}
 .date{font-size:2.5vw}
 .sun-times{font-size:2vh;margin-top:1.5vh}
 .weather-details{font-size:1.8vh;gap:20px;margin-top:8px}
 .current-icon{font-size:7.5vh}
 .current-temp{font-size:7.5vh}
 .current-desc{font-size:2.5vh}
 .section{font-size:2.2vh}
 .hour-time{font-size:2vh}
 .hour-icon{font-size:4.5vh}
 .hour-temp{font-size:3vh}
 .rain{font-size:1.8vh}
 .day-name{font-size:2.5vh}
 .day-icon{font-size:5vh}
 .day-temps{font-size:2.25vh}
 .dashboard{height:calc(100vh - 40px);grid-template-rows:5% minmax(0,1fr) 20%;gap:0.8%}
}
@media (orientation:portrait){
 html,body{overflow:auto;height:auto;min-height:100%}
 .dashboard{height:auto;min-height:100vh;grid-template-rows:auto auto auto;padding:8px;gap:10px}
 .top{grid-template-columns:1fr;grid-template-rows:auto auto}
 .clock-panel{min-height:36vh}
 .clock{font-size:25vw}
 .weather-panel{min-height:34vh}
 .days{min-height:18vh}
}
</style>
</head>
<body>
<main class="dashboard">
  <header class="brand">CLARECASTLE</header>
  <section class="top">
    <div class="panel clock-panel">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">Loading date…</div>
      <div class="sun-times"><div>☀ Sunrise <span id="sunrise">--:--</span></div><div>🌆 Sunset <span id="sunset">--:--</span></div></div>
    </div>
    <div class="panel weather-panel">
      <div class="current">
        <div class="current-icon" id="currentIcon">☁️</div>
        <div><div class="current-temp" id="currentTemp">--°C</div><div class="current-desc" id="currentDesc">Getting weather…</div></div>
      </div>
      <div class="weather-details">
        <div>Feels like <strong id="feelsLike">--°C</strong></div>
        <div>Wind <strong id="wind">--</strong></div>
      </div>
      <div class="rule"></div>
      <div>
        <div class="section">NEXT 4 HOURS</div>
        <div class="hours" id="hourly"><div class="hour">Loading…</div></div>
      </div>
    </div>
  </section>
  <section class="days" id="daily">
    <div class="day">Loading forecast…</div>
  </section>
  <div class="status" id="status" aria-live="polite"></div>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  function pad(n){return n<10?"0"+n:""+n;}
  function tick(){
    var n=new Date();
    $("clock").textContent=pad(n.getHours())+":"+pad(n.getMinutes());
    var ds=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var ms=["January","February","March","April","May","June","July","August","September","October","November","December"];
    $("date").textContent=ds[n.getDay()]+", "+n.getDate()+" "+ms[n.getMonth()];
  }
  tick();setInterval(tick,1000);
  function wx(c){
    if(c===0)return["☀️","Clear"];
    if(c===1)return["🌤️","Mainly clear"];
    if(c===2)return["⛅","Partly cloudy"];
    if(c===3)return["☁️","Cloudy"];
    if(c===45||c===48)return["🌫️","Fog"];
    if(c>=51&&c<=57)return["🌦️","Drizzle"];
    if(c>=61&&c<=67)return["🌧️","Rain"];
    if(c>=71&&c<=77)return["🌨️","Snow"];
    if(c>=80&&c<=82)return["🌦️","Showers"];
    if(c===85||c===86)return["🌨️","Snow showers"];
    if(c>=95)return["⛈️","Thunderstorm"];
    return["☁️","Mixed conditions"];
  }
  function deg(v){return Math.round(v)+"°";}
  function failed(){ $("currentDesc").textContent="Weather temporarily unavailable";$("status").textContent="Could not update weather. Check internet connection."; }
  function load(){
    var url="https://api.open-meteo.com/v1/forecast?latitude=52.814&longitude=-8.982&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=6&timezone=Europe%2FDublin";
    var x=new XMLHttpRequest();x.open("GET",url,true);x.timeout=15000;
    x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status>=200&&x.status<300){try{draw(JSON.parse(x.responseText));}catch(e){failed();}}else failed();};
    x.onerror=failed;x.ontimeout=failed;x.send();
  }
  function draw(d){
    var c=wx(d.current.weather_code);$("currentIcon").textContent=c[0];$("currentTemp").textContent=deg(d.current.temperature_2m)+"C";$("currentDesc").textContent=c[1];
    $("feelsLike").textContent=deg(d.current.apparent_temperature)+"C";
    var dirs=["N","NE","E","SE","S","SW","W","NW"],di=Math.round(d.current.wind_direction_10m/45)%8;
    $("wind").textContent=dirs[di]+" "+Math.round(d.current.wind_speed_10m)+" km/h";
    function shortTime(v){return v?v.substring(11,16):"--:--";}
    $("sunrise").textContent=shortTime(d.daily.sunrise[0]);$("sunset").textContent=shortTime(d.daily.sunset[0]);
    var now=new Date(),ids=[];
    for(var i=0;i<d.hourly.time.length;i++){var t=new Date(d.hourly.time[i]);if(t.getTime()>now.getTime()-30*60000){ids.push(i);if(ids.length===4)break;}}
    var h="";
    for(var j=0;j<ids.length;j++){var k=ids[j],dt=new Date(d.hourly.time[k]),w=wx(d.hourly.weather_code[k]);h+='<div class="hour"><div class="hour-time">'+pad(dt.getHours())+':00</div><div class="hour-icon">'+w[0]+'</div><div class="hour-temp">'+deg(d.hourly.temperature_2m[k])+'</div><div class="rain">'+d.hourly.precipitation_probability[k]+'% rain</div></div>';}
    $("hourly").innerHTML=h||"Hourly forecast unavailable";
    var names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],out="";
    for(var q=1;q<d.daily.time.length&&q<6;q++){var day=new Date(d.daily.time[q]+"T12:00:00"),z=wx(d.daily.weather_code[q]);out+='<div class="day"><div class="day-name">'+names[day.getDay()]+'</div><div class="day-icon">'+z[0]+'</div><div class="day-temps">'+deg(d.daily.temperature_2m_max[q])+' <span>/ '+deg(d.daily.temperature_2m_min[q])+'</span></div></div>';}
    $("daily").innerHTML=out;$("status").textContent="Updated "+pad(now.getHours())+":"+pad(now.getMinutes());
  }
  load();setInterval(load,15*60*1000);
}());
</script>
</body>
</html>
